name: Publish Wiki

on:
  push:
    branches: [main]
    paths:
      - wiki/**
      - .github/workflows/publish-wiki.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Publish Wiki source
        env:
          WIKI_PUSH_TOKEN: ${{ secrets.WIKI_PUSH_TOKEN }}
        run: |
          test -n "$WIKI_PUSH_TOKEN" || { echo "Wiki publishing needs the WIKI_PUSH_TOKEN repository secret. Create a new classic GitHub PAT with the repo scope, store it as WIKI_PUSH_TOKEN, then rerun this workflow."; exit 1; }
          rm -rf published-wiki
          git clone "https://x-access-token:${WIKI_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" published-wiki
          rsync -a --delete wiki/ published-wiki/
          cd published-wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "docs: publish wiki"
          wiki_branch="$(git branch --show-current)"
          git pull --rebase origin "$wiki_branch"
          git push "https://x-access-token:${WIKI_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" "HEAD:${wiki_branch}"